# Standalone alternative to compose.yaml; do not combine both files.
services:
  watchdog:
    image: ghcr.io/vardokr/nexus-webportalbot:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    env_file:
      - path: ./.env
        format: raw
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
