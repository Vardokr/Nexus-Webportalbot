# Add to compose.registry.yaml for browser access via public IPv4 or hostname.
services:
  watchdog:
    environment:
      DASHBOARD_ORIGIN: https://${SITE_HOST:?Hostname fehlt}
      DASHBOARD_TRUST_PROXY: "1"
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - watchdog
    environment:
      SITE_HOST: ${SITE_HOST:?Hostname fehlt}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
